<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>e2e interact page</title>
    <style>
      body { margin: 0; padding: 8px; font-family: sans-serif; }
      #card { width: 80px; height: 40px; background: #cde; }
      #zone { width: 160px; height: 80px; margin-top: 24px; border: 2px dashed #888; }
      button { margin: 8px 8px 0 0; }
    </style>
  </head>
  <body>
    <!-- Drag, permission, tabs and flow control (slice 2): an HTML5
         draggable card and a drop zone that records what was dropped, a
         button that opens a new tab, and a counter a flow clicks up. -->
    <div id="card" draggable="true">card</div>
    <div id="zone">drop here</div>
    <div id="dropped">nothing dropped</div>
    <button id="open-tab" type="button">Open tab</button>
    <button id="tick" type="button">Tick</button>
    <div id="ticks">0</div>
    <script>
      const card = document.getElementById('card');
      const zone = document.getElementById('zone');
      card.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', 'e2e-card');
      });
      zone.addEventListener('dragover', (e) => e.preventDefault());
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        document.getElementById('dropped').textContent =
          'dropped: ' + e.dataTransfer.getData('text/plain');
      });
      document.getElementById('open-tab').addEventListener('click', () => {
        window.open('/opened.html' + location.search, '_blank');
      });
      let ticks = 0;
      document.getElementById('tick').addEventListener('click', () => {
        ticks += 1;
        document.getElementById('ticks').textContent = String(ticks);
      });
    </script>
  </body>
</html>
