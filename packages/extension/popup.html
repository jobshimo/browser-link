<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>browser-link</title>
    <style>
      :root {
        --brand-from: #3b82f6;
        --brand-to: #1d4ed8;
        --bg: #ffffff;
        --bg-soft: #f8fafc;
        --border: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --text-faint: #94a3b8;
        --connected: #10b981;
        --connected-soft: #ecfdf5;
        --connected-ring: rgba(16, 185, 129, 0.18);
        --idle: #f59e0b;
        --idle-soft: #fffbeb;
        --error: #ef4444;
        --error-soft: #fef2f2;
        --shadow: 0 1px 0 rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      body {
        width: 320px;
        background:
          radial-gradient(circle at top right, rgba(59, 130, 246, 0.08), transparent 55%),
          radial-gradient(circle at top left, rgba(29, 78, 216, 0.05), transparent 50%), var(--bg);
      }

      .shell {
        padding: 16px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }

      .mark {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--brand-from), var(--brand-to));
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.6) inset,
          0 6px 14px rgba(29, 78, 216, 0.32);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
      }

      .mark svg {
        width: 18px;
        height: 18px;
      }

      .title {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
      }

      .title strong {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .title span {
        font-size: 11px;
        color: var(--text-faint);
        margin-top: 2px;
      }

      .card {
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        box-shadow: var(--shadow);
      }

      .status-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
        font-size: 12.5px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-faint);
        flex-shrink: 0;
        position: relative;
      }

      .card[data-state='connected'] .dot {
        background: var(--connected);
        box-shadow: 0 0 0 0 var(--connected-ring);
        animation: pulse 1.8s ease-in-out infinite;
      }

      .card[data-state='connected'] .status-label {
        color: var(--connected);
      }

      .card[data-state='idle'] .dot {
        background: var(--idle);
      }

      .card[data-state='idle'] .status-label {
        color: var(--idle);
      }

      .card[data-state='error'] .dot {
        background: var(--error);
      }

      .card[data-state='error'] .status-label {
        color: var(--error);
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 var(--connected-ring);
        }
        70% {
          box-shadow: 0 0 0 7px transparent;
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }

      .tab-id {
        margin-left: auto;
        font-family: 'SFMono-Regular', ui-monospace, Menlo, monospace;
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 5px;
        background: rgba(15, 23, 42, 0.05);
        color: var(--text-muted);
        font-weight: 500;
        letter-spacing: 0.01em;
      }

      .url {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        font-family: 'SFMono-Regular', ui-monospace, Menlo, monospace;
        font-size: 11px;
        color: var(--text-muted);
        word-break: break-all;
        line-height: 1.5;
        max-height: 32px;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      button {
        margin-top: 12px;
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.005em;
        transition:
          transform 0.08s ease,
          box-shadow 0.15s ease,
          opacity 0.15s ease,
          background 0.15s ease;
      }

      button:active:not(:disabled) {
        transform: translateY(1px);
      }

      button.primary {
        background: linear-gradient(135deg, var(--brand-from), var(--brand-to));
        color: #ffffff;
        box-shadow: 0 6px 14px rgba(29, 78, 216, 0.28);
      }

      button.primary:hover:not(:disabled) {
        box-shadow: 0 8px 18px rgba(29, 78, 216, 0.38);
      }

      button.danger {
        background: #ffffff;
        color: var(--error);
        border: 1px solid var(--error);
      }

      button.danger:hover:not(:disabled) {
        background: var(--error-soft);
      }

      button:disabled {
        opacity: 0.55;
        cursor: progress;
      }

      .footer {
        margin-top: 12px;
        font-size: 10.5px;
        color: var(--text-faint);
        text-align: center;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="mark" aria-hidden="true">
          <svg
            viewBox="0 0 128 128"
            fill="none"
            stroke="currentColor"
            stroke-width="11"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M52 78 L36 78 A22 22 0 0 1 36 34 L52 34" />
            <path d="M76 34 L92 34 A22 22 0 0 1 92 78 L76 78" />
            <line x1="44" y1="56" x2="84" y2="56" />
          </svg>
        </div>
        <div class="title">
          <strong>browser-link</strong>
          <span>MCP bridge for this tab</span>
        </div>
      </header>

      <div id="card" class="card" data-state="idle">
        <div class="status-row">
          <span class="dot" aria-hidden="true"></span>
          <span id="status-label" class="status-label">Loading…</span>
          <span id="tab-id" class="tab-id" hidden></span>
        </div>
        <div id="url" class="url"></div>
      </div>

      <button id="action" class="primary" disabled>…</button>

      <div class="footer">manual · per-tab · loopback</div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
