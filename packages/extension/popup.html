<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>browser-link</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 14px;
        width: 280px;
        color: #1f2937;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 10px;
        letter-spacing: 0.3px;
      }
      .status {
        padding: 8px 10px;
        border-radius: 6px;
        margin-bottom: 8px;
        font-size: 12px;
        line-height: 1.4;
      }
      .status.connected {
        background: #d1fae5;
        color: #065f46;
      }
      .status.disconnected {
        background: #fef3c7;
        color: #92400e;
      }
      .status.error {
        background: #fee2e2;
        color: #991b1b;
      }
      .url {
        font-size: 11px;
        color: #6b7280;
        word-break: break-all;
        margin-bottom: 10px;
        max-height: 36px;
        overflow: hidden;
      }
      .tab-id {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 600;
      }
      button {
        width: 100%;
        padding: 9px 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: opacity 0.15s ease;
      }
      button.primary {
        background: #2563eb;
        color: white;
      }
      button.danger {
        background: #dc2626;
        color: white;
      }
      button:hover {
        opacity: 0.9;
      }
      button:disabled {
        background: #9ca3af;
        cursor: not-allowed;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <h1>browser-link</h1>
    <div id="status" class="status disconnected">Cargando…</div>
    <div id="url" class="url"></div>
    <button id="action" class="primary" disabled>…</button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
