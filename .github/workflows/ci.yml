name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Top-level permissions are read-only — overridden per-job. The release
# job below needs contents:write + id-token:write; everything else stays
# locked down.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v6

      # pnpm must be on PATH before `setup-node`'s `cache: pnpm` runs.
      # The version is resolved from the root `packageManager` field via
      # the `package_json_file` input, so updating that one line bumps
      # both local and CI in lockstep. `@v6` runs on Node 24 inside the
      # action — required, because pnpm 11 itself needs Node >=22.13 and
      # `@v4` self-installs pnpm with Node 20.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Coverage (Ubuntu only — informational)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @jobshimo/browser-link run test:coverage

      - name: Build
        run: pnpm run build

  # Tag + GitHub Release + npm publish, all in one job downstream of the
  # CI matrix. Lives inside ci.yml on purpose — npm Trusted Publishers
  # validates the OIDC `workflow_ref` claim, and chained workflows
  # (workflow_run, workflow_call) ship a token whose claims don't match
  # the direct-trigger contract npm expects. By hanging this off `needs:
  # ci` in the same workflow file, the OIDC token gets `event_name: push`
  # and `workflow_ref: <owner>/<repo>/.github/workflows/ci.yml@<ref>` —
  # which is exactly what the Trusted Publisher entry on npmjs.com is
  # configured to accept.
  release:
    name: Tag + Release + npm publish
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required by npm Trusted Publisher (OIDC) — the job exchanges its
      # GitHub OIDC token for a short-lived npm credential at publish
      # time. No NPM_TOKEN stored anywhere.
      id-token: write
    concurrency:
      # Serialize release runs so two near-simultaneous merges don't race
      # on the same version number. `cancel-in-progress: false` because a
      # partial release would be worse than waiting.
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Read version from packages/server/package.json
        id: read
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/server/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "  → version on main: $VERSION"

      # === GitHub Release half ============================================
      - name: Skip if release already exists
        id: tagcheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "  → release v$VERSION already exists, nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "  → release v$VERSION does not exist, will create"
          fi

      - name: Extract changelog section for this version
        if: steps.tagcheck.outputs.skip == 'false'
        id: notes
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$VERSION" '
            # Stop on the next "## [..." header after we entered the section.
            /^##[[:space:]]+\[/ {
              if (in_section) { exit }
              if ($0 ~ "\\["ver"\\]") { in_section = 1; next }
            }
            in_section { print }
          ' packages/server/CHANGELOG.md > "$NOTES_FILE"
          # Strip leading/trailing blank lines.
          awk 'BEGIN{p=0} /[^[:space:]]/{p=1} p{print}' "$NOTES_FILE" \
            | sed -e :a -e '/^\s*$/{$d;N;ba' -e '}' > "$NOTES_FILE.trim"
          mv "$NOTES_FILE.trim" "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "  ⚠ CHANGELOG has no [$VERSION] section — release will use a fallback note"
            echo "Release v$VERSION (no CHANGELOG section found)." > "$NOTES_FILE"
          fi
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "--- notes preview ---"
          head -n 40 "$NOTES_FILE"

      - name: Create tag + GitHub Release
        if: steps.tagcheck.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.read.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # --target creates the tag via the REST API if it does not exist
          # yet, then attaches the release. No `git push`, no branch
          # protection interaction.
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "v$VERSION" \
            --notes-file "$NOTES_FILE"
          echo "  → created release v$VERSION targeting $SHA"

      # === npm publish half ===============================================
      # Independent skip path so a partial-failure re-run (tag created but
      # publish failed last time) can publish without re-creating the tag.

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Skip if npm has this version already
        id: npmcheck
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@jobshimo/browser-link@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "  → npm already has @jobshimo/browser-link@$VERSION, skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "  → @jobshimo/browser-link@$VERSION is not on npm yet, will publish"
          fi

      - name: Install dependencies
        if: steps.npmcheck.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      # Diagnostic preamble — print bundled tool versions and OIDC claims
      # for future debugging. NEVER allowed to block the publish:
      # `continue-on-error: true` plus `|| true` on the brittle pipe
      # (`base64 -d` against a padding-less JWT segment exits non-zero
      # on GNU base64 even when the output is correct — that was the
      # exact bug that swallowed v0.7.4).
      - name: Inspect publish environment + OIDC claims
        if: steps.npmcheck.outputs.skip == 'false'
        continue-on-error: true
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        run: |
          set -uo pipefail
          echo "::group::Bundled tool versions"
          echo "node     $(node --version)"
          echo "npm      $(npm --version)"
          echo "pnpm     $(pnpm --version)"
          echo "::endgroup::"
          echo "::group::OIDC token claims (payload only, no signature)"
          TOKEN=$(curl -sLS \
            -H "User-Agent: actions/oidc-client" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | jq -r '.value')
          (echo "$TOKEN" \
            | cut -d. -f2 \
            | tr '_-' '/+' \
            | base64 -d 2>/dev/null \
            | jq '{
                iss, aud, sub,
                repository, repository_owner, repository_id,
                workflow, workflow_ref, job_workflow_ref,
                event_name, ref, sha, environment, runner_environment
              }') || true
          echo "::endgroup::"
          exit 0

      - name: Publish to npm with provenance (npm 11+ via npx)
        if: steps.npmcheck.outputs.skip == 'false'
        working-directory: packages/server
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          # Trusted Publishing requires npm >= 11.5.1 for the OIDC
          # handshake (older npm silently fails and emits a misleading
          # 404 against the registry — see npm/cli#9088 and #8976).
          # Node 22 LTS bundles npm 10.x today. We drive the publish
          # with a fresh npm via npx so the runner's globally installed
          # npm stays untouched. Mutating the global npm during a
          # release run was the failure mode on v0.7.3 (`npm install -g
          # npm@latest` broke npm mid-upgrade — `Cannot find module
          # 'promise-retry'`).
          #
          # We pin npm@11.5.1 — the version that first worked end-to-end
          # for this repo's Trusted Publisher (v0.7.5 release). Floating
          # `npm@latest` broke v0.8.3 publish: between v0.8.2 (which
          # published OK on ~npm 11.x intermediate) and v0.8.3 (which got
          # npm@latest = 11.14.1), npm regressed how it sends the OIDC
          # token to the registry — the JWT is identical and sigstore
          # accepts it for provenance, but the registry returns
          # `400 Bad Request - OIDC publish authorize: Invalid token`.
          # Pinning to 11.5.1 neutralises the regression and removes
          # `npm@latest` as a hidden moving dependency of every release.
          # No NPM_TOKEN — Trusted Publisher exchanges the GitHub OIDC
          # token (granted via permissions.id-token: write above) for a
          # short-lived npm credential at publish time.
          npx --yes --package=npm@11.5.1 -- npm publish --provenance --access public
          echo "  → published @jobshimo/browser-link@$VERSION"
