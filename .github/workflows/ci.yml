name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Top-level permissions are read-only — overridden per-job. The release
# job below needs contents:write + id-token:write; everything else stays
# locked down.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm must be on PATH before `setup-node`'s `cache: pnpm` runs.
      # The version is resolved from the root `packageManager` field via
      # the `package_json_file` input, so updating that one line bumps
      # both local and CI in lockstep. `@v6` runs on Node 24 inside the
      # action — required, because pnpm 11 itself needs Node >=22.13 and
      # `@v4` self-installs pnpm with Node 20.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Coverage (Ubuntu only — informational)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @jobshimo/browser-link run test:coverage

      - name: Build
        run: pnpm run build

      # Pack the publishable tarball (prepack bundles the extension),
      # check its entries and install + run it from a temp prefix, so a
      # broken package fails the PR instead of the publish.
      - name: Smoke-test the npm tarball
        run: node scripts/smoke-tarball.mjs

  # Real-Chrome end-to-end net: the built extension in headless Chrome,
  # driven through the built server over MCP stdio (packages/e2e). Runs in
  # parallel with the matrix so a failure is attributed to this job alone.
  # Two legs, as two jobs rather than a matrix, because they gate
  # differently: `release` needs this one (Chrome 118, the oldest Chrome
  # the extension supports, pinned so it never moves) and not `e2e-stable`
  # (the runner's auto-updating Chrome), which reports without blocking;
  # `needs:` on a matrix job waits on, and fails with, every leg.
  # Chrome 118: Chrome for Testing, installed by an exact @puppeteer/browsers
  # and cached on both versions. lsof is not in the runner image; the
  # harness uses it to prove no process on 17529/17530 was disturbed.
  # Each leg records the browser it ran on in the step summary and in the
  # e2e-result-<leg> artifact (packages/e2e/build/e2e-result.json).
  e2e:
    name: e2e (Chrome 118, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CFT_CHROME: 118.0.5993.70
      PUPPETEER_BROWSERS: 3.2.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install lsof
        run: command -v lsof || { sudo apt-get update && sudo apt-get install -y lsof; }

      - name: Cache Chrome for Testing
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chrome-for-testing
          key: cft-chrome-${{ env.CFT_CHROME }}-puppeteer-browsers-${{ env.PUPPETEER_BROWSERS }}-${{ runner.os }}

      # Prints the executable path; a cached install is found, not re-downloaded.
      - name: Install Chrome for Testing ${{ env.CFT_CHROME }}
        id: cft
        run: |
          set -euo pipefail
          path=$(npx --yes "@puppeteer/browsers@$PUPPETEER_BROWSERS" install "chrome@$CFT_CHROME" \
            --path "$HOME/.cache/chrome-for-testing" --format '{{path}}' | tail -n 1)
          test -x "$path"
          echo "chrome=$path" >> "$GITHUB_OUTPUT"

      - name: End-to-end (one line per tool)
        env:
          CHROME_PATH: ${{ steps.cft.outputs.chrome }}
          E2E_NO_SANDBOX: '1'
          E2E_LEG: chrome 118
        run: pnpm test:e2e

      - name: Upload the browser record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-result-chrome-118
          path: packages/e2e/build/e2e-result.json
          if-no-files-found: warn

  # The runner's own Chrome, /usr/bin/google-chrome (CHROME_BIN in
  # actions/runner-images images/ubuntu/scripts/build/install-google-chrome.sh).
  # It updates under us, so it reports and does not block the publish
  # (`release` does not need it); on main a failure opens or updates an
  # issue (e2e-stable-issue below).
  e2e-stable:
    name: e2e (stable Chrome, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      browser: ${{ steps.record.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install lsof
        run: command -v lsof || { sudo apt-get update && sudo apt-get install -y lsof; }

      - name: End-to-end (one line per tool)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          E2E_NO_SANDBOX: '1'
          E2E_LEG: stable Chrome
        run: pnpm test:e2e

      - name: Read the browser record
        id: record
        if: always()
        run: |
          browser=$(jq -r '.browser // "unknown"' packages/e2e/build/e2e-result.json 2>/dev/null || echo unknown)
          # Printable ASCII only: a CR/LF in the value cannot add output lines.
          browser=$(printf '%s' "$browser" | tr -cd '\040-\176')
          echo "browser=$browser" >> "$GITHUB_OUTPUT"

      - name: Upload the browser record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-result-chrome-stable
          path: packages/e2e/build/e2e-result.json
          if-no-files-found: warn

  # A stable-leg failure on main opens one tracking issue, or comments on
  # it while it stays open. Its own job so only it holds issues: write and
  # none of the code under test runs with that token.
  e2e-stable-issue:
    name: Report stable-Chrome e2e failure
    needs: e2e-stable
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BROWSER: ${{ needs.e2e-stable.outputs.browser }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title='e2e: stable Chrome leg failing on main'
          body=$(printf '%s\n\n- Run: %s\n- Chrome: %s\n- Commit: %s\n\n%s\n' \
            'The e2e leg on the runner image stable Chrome failed on main.' \
            "$RUN_URL" "${BROWSER:-unknown}" "$SHA" \
            'This leg does not block the publish; the Chrome 118 leg does.')
          num=$(gh issue list --state open --limit 200 --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  # Differential e2e (scripts/e2e-diff.mjs): HEAD's harness drives the
  # build of merge-base(origin/<PR target>, HEAD) and HEAD's build on Chrome
  # 118; the normalised call records must be equal. A PR gate for refactor
  # PRs, so it is not in `release.needs`. A job cannot carry a `paths:`
  # filter, so the first step lists the PR's files against the merge-base
  # (NUL-separated, unquoted, so no name can slip past) and decides:
  # - runs (base vs HEAD) for any non-test, non-docs change under
  #   packages/server (src, package.json, tsconfig), packages/extension (src,
  #   manifest, HTML, icons, package.json, tsconfig, build scripts),
  #   packages/shared (src, package.json), packages/core, and the dependency
  #   files (root package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .npmrc);
  # - adds a self-diff (two HEAD runs) when the harness, the normalise table,
  #   packages/e2e/package.json or the fixtures change;
  # - skips otherwise: tests (*.test.*, *.spec.*, __tests__, vitest configs)
  #   and docs (*.md) never trigger it.
  # On a push to main it runs the self-diff alone; that replaces the nightly
  # self-diff of the design (the workflow has no schedule trigger). Stacked
  # PRs do not trigger it: the workflow runs only on PRs to main, although the
  # script itself compares with merge-base(<target>, HEAD) and supports them.
  # Script exit codes: 1 difference, 2 harness failure, 3 setup error.
  # The normalised base record is cached per base sha, harness hash and Chrome.
  e2e-diff:
    name: e2e differential (Chrome 118, ubuntu)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CFT_CHROME: 118.0.5993.70
      PUPPETEER_BROWSERS: 3.2.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what runs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "mode=self" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          product=0
          harness=0
          while IFS= read -r -d '' f; do
            case "$f" in
              packages/e2e/src/run.mjs | packages/e2e/src/lib.mjs | packages/e2e/src/normalise.mjs | \
                packages/e2e/pages/* | packages/e2e/package.json)
                harness=1 ;;
              *.md | *.test.* | *.spec.* | */__tests__/* | */vitest.config.*) ;;
              packages/server/src/* | packages/server/package.json | packages/server/tsconfig*.json | \
                packages/extension/src/* | packages/extension/*.json | packages/extension/*.html | \
                packages/extension/*.mjs | packages/extension/icons/* | \
                packages/shared/src/* | packages/shared/package.json | packages/core/* | \
                package.json | pnpm-lock.yaml | pnpm-workspace.yaml | .npmrc)
                product=1 ;;
            esac
          done < <(git -c core.quotePath=false diff --name-only -z "$base" HEAD)
          if [ "$harness" = 1 ]; then
            mode=diff-self
          elif [ "$product" = 1 ]; then
            mode=diff
          else
            mode=none
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "e2e-diff: base $base, mode $mode"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.scope.outputs.mode != 'none'
        with:
          package_json_file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.mode != 'none'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.scope.outputs.mode != 'none'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.scope.outputs.mode != 'none'
        run: pnpm run build

      - name: Install lsof
        if: steps.scope.outputs.mode != 'none'
        run: command -v lsof || { sudo apt-get update && sudo apt-get install -y lsof; }

      - name: Cache Chrome for Testing
        if: steps.scope.outputs.mode != 'none'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chrome-for-testing
          key: cft-chrome-${{ env.CFT_CHROME }}-puppeteer-browsers-${{ env.PUPPETEER_BROWSERS }}-${{ runner.os }}

      - name: Install Chrome for Testing ${{ env.CFT_CHROME }}
        id: cft
        if: steps.scope.outputs.mode != 'none'
        run: |
          set -euo pipefail
          path=$(npx --yes "@puppeteer/browsers@$PUPPETEER_BROWSERS" install "chrome@$CFT_CHROME" \
            --path "$HOME/.cache/chrome-for-testing" --format '{{path}}' | tail -n 1)
          test -x "$path"
          echo "chrome=$path" >> "$GITHUB_OUTPUT"

      - name: Restore the base record
        id: base-record
        if: steps.scope.outputs.mode == 'diff' || steps.scope.outputs.mode == 'diff-self'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/e2e/build/e2e-base-record.json
          key: e2e-record-${{ steps.scope.outputs.base }}-${{ hashFiles('packages/e2e/src/run.mjs', 'packages/e2e/src/lib.mjs', 'packages/e2e/src/normalise.mjs', 'packages/e2e/pages/**') }}-${{ env.CFT_CHROME }}

      - name: Differential
        if: steps.scope.outputs.mode != 'none'
        env:
          CHROME_PATH: ${{ steps.cft.outputs.chrome }}
          E2E_NO_SANDBOX: '1'
          MODE: ${{ steps.scope.outputs.mode }}
          BASE_REF: ${{ github.base_ref }}
          BASE_RECORD: packages/e2e/build/e2e-base-record.json
        run: |
          set -euo pipefail
          case "$MODE" in
            self) node scripts/e2e-diff.mjs --self-diff-only ;;
            diff) node scripts/e2e-diff.mjs "origin/$BASE_REF" --base-record "$BASE_RECORD" ;;
            diff-self) node scripts/e2e-diff.mjs "origin/$BASE_REF" --base-record "$BASE_RECORD" --self-diff ;;
          esac

      - name: Save the base record
        if: always() && steps.base-record.outcome == 'success' && steps.base-record.outputs.cache-hit != 'true' && hashFiles('packages/e2e/build/e2e-base-record.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/e2e/build/e2e-base-record.json
          key: ${{ steps.base-record.outputs.cache-primary-key }}

  # Tag + GitHub Release + npm publish, all in one job downstream of the
  # CI matrix. Lives inside ci.yml on purpose — npm Trusted Publishers
  # validates the OIDC `workflow_ref` claim, and chained workflows
  # (workflow_run, workflow_call) ship a token whose claims don't match
  # the direct-trigger contract npm expects. By hanging this off `needs:
  # ci` in the same workflow file, the OIDC token gets `event_name: push`
  # and `workflow_ref: <owner>/<repo>/.github/workflows/ci.yml@<ref>` —
  # which is exactly what the Trusted Publisher entry on npmjs.com is
  # configured to accept.
  release:
    name: Tag + Release + npm publish
    # e2e (Chrome 118) too: a red end-to-end net blocks the publish.
    # e2e-stable is left out on purpose: it reports, it does not gate.
    needs: [ci, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required by npm Trusted Publisher (OIDC) — the job exchanges its
      # GitHub OIDC token for a short-lived npm credential at publish
      # time. No NPM_TOKEN stored anywhere.
      id-token: write
    concurrency:
      # Serialize release runs so two near-simultaneous merges don't race
      # on the same version number. `cancel-in-progress: false` because a
      # partial release would be worse than waiting.
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Read version from packages/server/package.json
        id: read
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/server/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "  → version on main: $VERSION"

      # === GitHub Release half ============================================
      - name: Skip if release already exists
        id: tagcheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "  → release v$VERSION already exists, nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "  → release v$VERSION does not exist, will create"
          fi

      # === Build + smoke test =============================================
      # Runs before anything irreversible: a broken tarball stops the job
      # here, before the tag, the GitHub Release and the npm publish.
      # Unconditional (not tied to the skip checks) so a partial-failure
      # re-run also smoke-tests what it is about to publish.

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke-test the npm tarball
        run: node scripts/smoke-tarball.mjs

      - name: Extract changelog section for this version
        if: steps.tagcheck.outputs.skip == 'false'
        id: notes
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$VERSION" '
            # Stop on the next "## [..." header after we entered the section.
            /^##[[:space:]]+\[/ {
              if (in_section) { exit }
              if ($0 ~ "\\["ver"\\]") { in_section = 1; next }
            }
            in_section { print }
          ' packages/server/CHANGELOG.md > "$NOTES_FILE"
          # Strip leading/trailing blank lines.
          awk 'BEGIN{p=0} /[^[:space:]]/{p=1} p{print}' "$NOTES_FILE" \
            | sed -e :a -e '/^\s*$/{$d;N;ba' -e '}' > "$NOTES_FILE.trim"
          mv "$NOTES_FILE.trim" "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "  ⚠ CHANGELOG has no [$VERSION] section — release will use a fallback note"
            echo "Release v$VERSION (no CHANGELOG section found)." > "$NOTES_FILE"
          fi
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "--- notes preview ---"
          head -n 40 "$NOTES_FILE"

      - name: Create tag + GitHub Release
        if: steps.tagcheck.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.read.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # --target creates the tag via the REST API if it does not exist
          # yet, then attaches the release. No `git push`, no branch
          # protection interaction.
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "v$VERSION" \
            --notes-file "$NOTES_FILE"
          echo "  → created release v$VERSION targeting $SHA"

      # === npm publish half ===============================================
      # Independent skip path so a partial-failure re-run (tag created but
      # publish failed last time) can publish without re-creating the tag.

      - name: Skip if npm has this version already
        id: npmcheck
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@jobshimo/browser-link@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "  → npm already has @jobshimo/browser-link@$VERSION, skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "  → @jobshimo/browser-link@$VERSION is not on npm yet, will publish"
          fi

      # Diagnostic preamble — print bundled tool versions and OIDC claims
      # for future debugging. NEVER allowed to block the publish:
      # `continue-on-error: true` plus `|| true` on the brittle pipe
      # (`base64 -d` against a padding-less JWT segment exits non-zero
      # on GNU base64 even when the output is correct — that was the
      # exact bug that swallowed v0.7.4).
      - name: Inspect publish environment + OIDC claims
        if: steps.npmcheck.outputs.skip == 'false'
        continue-on-error: true
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        run: |
          set -uo pipefail
          echo "::group::Bundled tool versions"
          echo "node     $(node --version)"
          echo "npm      $(npm --version)"
          echo "pnpm     $(pnpm --version)"
          echo "::endgroup::"
          echo "::group::OIDC token claims (payload only, no signature)"
          TOKEN=$(curl -sLS \
            -H "User-Agent: actions/oidc-client" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | jq -r '.value')
          (echo "$TOKEN" \
            | cut -d. -f2 \
            | tr '_-' '/+' \
            | base64 -d 2>/dev/null \
            | jq '{
                iss, aud, sub,
                repository, repository_owner, repository_id,
                workflow, workflow_ref, job_workflow_ref,
                event_name, ref, sha, environment, runner_environment
              }') || true
          echo "::endgroup::"
          exit 0

      - name: Publish to npm with provenance (npm 11+ via npx)
        if: steps.npmcheck.outputs.skip == 'false'
        working-directory: packages/server
        env:
          VERSION: ${{ steps.read.outputs.version }}
          # actions/setup-node@v7 with `registry-url` set installs a
          # placeholder `NODE_AUTH_TOKEN: XXXXX-XXXXX-XXXXX-XXXXX` into
          # the env even when no token input is given. Recent npm
          # versions (post-11.5.1 server-side change) prioritise that
          # placeholder over the OIDC flow and send it to the registry,
          # which rejects with `400 Bad Request - OIDC publish authorize:
          # Invalid token`. Clearing the variable forces npm to fall
          # back to OIDC. See: github.com/orgs/community/discussions/176761
          # This is the only reason v0.8.3 / v0.8.4 publish failed —
          # the JWT itself was always valid (sigstore accepted it for
          # provenance signing on the same run).
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          # Trusted Publishing requires npm >= 11.5.1 for the OIDC
          # handshake (older npm silently fails and emits a misleading
          # 404 against the registry — see npm/cli#9088 and #8976).
          # Node 22 LTS bundles npm 10.x today. We drive the publish
          # with a fresh npm via npx so the runner's globally installed
          # npm stays untouched. Mutating the global npm during a
          # release run was the failure mode on v0.7.3 (`npm install -g
          # npm@latest` broke npm mid-upgrade — `Cannot find module
          # 'promise-retry'`).
          #
          # We pin npm@11.5.1 — the version that first worked end-to-end
          # for this repo's Trusted Publisher (v0.7.5 release). Floating
          # `npm@latest` broke v0.8.3 publish: between v0.8.2 (which
          # published OK on ~npm 11.x intermediate) and v0.8.3 (which got
          # npm@latest = 11.14.1), npm regressed how it sends the OIDC
          # token to the registry — the JWT is identical and sigstore
          # accepts it for provenance, but the registry returns
          # `400 Bad Request - OIDC publish authorize: Invalid token`.
          # Pinning to 11.5.1 neutralises the regression and removes
          # `npm@latest` as a hidden moving dependency of every release.
          # No NPM_TOKEN — Trusted Publisher exchanges the GitHub OIDC
          # token (granted via permissions.id-token: write above) for a
          # short-lived npm credential at publish time.
          npx --yes --package=npm@11.5.1 -- npm publish --provenance --access public
          echo "  → published @jobshimo/browser-link@$VERSION"
