name: Release Finalize

# Tags + creates the GitHub Release whenever a fresh version lands on
# main, then publishes the package to npm.
#
# Trigger model — why workflow_run and not push:
#   - We MUST NOT tag or publish a broken commit. workflow_run lets us
#     wait for the CI workflow to finish on main and gate the rest of
#     the job on `conclusion == 'success'`. Cleaner than polling
#     check-runs from inside a `push` workflow.
#   - The Version Gate guarantees that anything landing on main has a
#     fresh, aligned version. So the rule is simply: if main moves, and
#     CI is green, there is exactly one release to cut — the one whose
#     version is in `packages/server/package.json`.
#
# Why we don't parse the commit subject anymore:
#   The previous design read `chore(release): vX.Y.Z` from the squash
#   commit subject. That broke twice already (squash adds `(#NN)`, rebase
#   doesn't, GitHub UI edits drop the convention, etc). The version file
#   is the single source of truth — read it directly.
#
# Why no `git push` anywhere:
#   `gh release create --target $SHA` creates the tag via the REST API
#   and the GitHub Release in one call. Zero pushes. Branch protection
#   on main (or any other branch) is irrelevant to this flow.
#
# npm publish — Trusted Publisher (OIDC):
#   The npmjs package `@jobshimo/browser-link` is configured to trust
#   this workflow file (Owner: jobshimo, Repo: browser-link, Workflow:
#   release-finalize.yml). The job exchanges its GitHub OIDC token for
#   a short-lived npm token at publish time. No NPM_TOKEN stored in
#   secrets. `--provenance` makes npm attach a verifiable attestation
#   tying the published tarball to this exact workflow run.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  # Required by npm's Trusted Publisher flow — lets `npm publish` request
  # an OIDC token from GitHub that npm verifies against the configured
  # trusted publisher.
  id-token: write

concurrency:
  # Serialize finalize runs so two near-simultaneous merges don't race on
  # the same version number. `cancel-in-progress: false` because a partial
  # finalize would be worse than waiting.
  group: release-finalize-main
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    # Defence in depth: the trigger already filters `branches: [main]`,
    # but pin all three conditions on the job too.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - uses: actions/checkout@v6
        with:
          # The SHA whose CI just passed. We tag THAT commit, not whatever
          # is at main right now (main might have moved).
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Read version from packages/server/package.json
        id: read
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/server/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "  → version on main: $VERSION"

      # === GitHub Release half ============================================
      - name: Skip if release already exists
        id: tagcheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "  → release v$VERSION already exists, nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "  → release v$VERSION does not exist, will create"
          fi

      - name: Extract changelog section for this version
        if: steps.tagcheck.outputs.skip == 'false'
        id: notes
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$VERSION" '
            # Stop on the next "## [..." header after we entered the section.
            /^##[[:space:]]+\[/ {
              if (in_section) { exit }
              if ($0 ~ "\\["ver"\\]") { in_section = 1; next }
            }
            in_section { print }
          ' packages/server/CHANGELOG.md > "$NOTES_FILE"
          # Strip leading/trailing blank lines.
          awk 'BEGIN{p=0} /[^[:space:]]/{p=1} p{print}' "$NOTES_FILE" \
            | sed -e :a -e '/^\s*$/{$d;N;ba' -e '}' > "$NOTES_FILE.trim"
          mv "$NOTES_FILE.trim" "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "  ⚠ CHANGELOG has no [$VERSION] section — release will use a fallback note"
            echo "Release v$VERSION (no CHANGELOG section found)." > "$NOTES_FILE"
          fi
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "--- notes preview ---"
          head -n 40 "$NOTES_FILE"

      - name: Create tag + GitHub Release
        if: steps.tagcheck.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.read.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # --target creates the tag via the REST API if it does not exist
          # yet, then attaches the release. No `git push`, no branch
          # protection interaction.
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "v$VERSION" \
            --notes-file "$NOTES_FILE"
          echo "  → created release v$VERSION targeting $SHA"

      # === npm publish half ===============================================
      # Independent skip path so a partial-failure re-run (tag created but
      # publish failed last time) can publish without re-creating the tag.

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Skip if npm has this version already
        id: npmcheck
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@jobshimo/browser-link@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "  → npm already has @jobshimo/browser-link@$VERSION, skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "  → @jobshimo/browser-link@$VERSION is not on npm yet, will publish"
          fi

      - name: Install dependencies
        if: steps.npmcheck.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Publish to npm with provenance
        if: steps.npmcheck.outputs.skip == 'false'
        working-directory: packages/server
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          # No NPM_TOKEN — Trusted Publisher exchanges the GitHub OIDC
          # token (granted via permissions.id-token: write above) for a
          # short-lived npm credential. --provenance attaches a signed
          # attestation showing this exact workflow run published the
          # tarball.
          #
          # npm publish (not pnpm publish) is intentional here: npm CLI
          # has the most mature Trusted Publishing implementation. The
          # `prepublishOnly` script in packages/server/package.json still
          # invokes pnpm internally for the clean/build steps; npm just
          # drives the publish itself.
          npm publish --provenance --access public
          echo "  → published @jobshimo/browser-link@$VERSION"
